<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yacine Live - جدول المباريات</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg: #0a0a0b; --card: #16161a; --text: #fff; --accent: #4ade80; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; color: var(--accent); }
        .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; max-width: 900px; margin: 0 auto; }
        .event-card { background: var(--card); border-radius: 14px; padding: 20px; text-align: center; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
        .event-card:hover, .event-card:focus { border-color: var(--accent); transform: scale(1.03); outline: none; }
        .event-card img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px; }
        .event-name { font-size: 16px; font-weight: bold; margin: 10px 0; }
        .event-time { color: #888; font-size: 14px; }
        #playerContainer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; }
        #player { width: 100%; height: 100%; }
        #closePlayer { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; z-index: 3000; }
        .quality-bar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 3000; }
        .quality-btn { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .quality-btn.active { background: var(--accent); color: #000; font-weight: bold; }
        #loading { text-align: center; color: #888; margin-top: 50px; font-size: 18px; }
    </style>
</head>
<body>

<div class="header">
    <h1>⚽ Yacine Live</h1>
    <p style="color:#888;">جدول المباريات المباشرة</p>
</div>

<div id="loading">جاري تحميل المباريات...</div>
<div class="events-grid" id="container"></div>

<div id="playerContainer">
    <button id="closePlayer" onclick="closePlayer()">✕ إغلاق</button>
    <video id="player" controls autoplay></video>
    <div class="quality-bar" id="qualityBar"></div>
</div>

<script>
    let hls = null;
    let currentServers = [];
    let currentQualityIndex = 0;

    async function loadEvents() {
        try {
            const res = await fetch("https://proxy-8gh.pages.dev/api/events");
            const data = await res.json();
            document.getElementById('loading').style.display = 'none';
            renderEvents(data.data || []);
        } catch (e) {
            document.getElementById('loading').innerText = 'خطأ: ' + e.message;
        }
    }

    function renderEvents(events) {
        const container = document.getElementById('container');
        container.innerHTML = '';
        
        events.forEach(event => {
            const card = document.createElement('div');
            card.className = 'event-card';
            card.tabIndex = 0;
            card.innerHTML = `
                <img src="${event.logo || ''}" onerror="this.style.display='none'">
                <div class="event-name">${event.name || event.title || 'مباراة'}</div>
                <div class="event-time">${event.time || ''}</div>
            `;
            card.onclick = () => playEvent(event);
            card.onkeydown = (e) => { if (e.key === 'Enter') playEvent(event); };
            container.appendChild(card);
        });
        
        if (events.length > 0) container.querySelector('.event-card').focus();
    }

    async function playEvent(event) {
        const eventId = event.id || event.event_id;
        if (!eventId) return;
        
        try {
            const res = await fetch(`https://proxy-8gh.pages.dev/api/events/${eventId}`);
            const json = await res.json();
            
            currentServers = json.data?.servers || json.servers || json.data || [];
            currentQualityIndex = 0;
            
            if (!currentServers.length) { alert('لا توجد سيرفرات'); return; }
            
            document.getElementById('playerContainer').style.display = 'block';
            renderQualityButtons();
            playServer(0);
        } catch (e) {
            alert('خطأ: ' + e.message);
        }
    }

    function renderQualityButtons() {
        const bar = document.getElementById('qualityBar');
        bar.innerHTML = '';
        currentServers.forEach((server, index) => {
            const btn = document.createElement('button');
            btn.className = 'quality-btn' + (index === currentQualityIndex ? ' active' : '');
            btn.innerText = server.name || `Server ${index + 1}`;
            btn.onclick = () => { currentQualityIndex = index; playServer(index); renderQualityButtons(); };
            bar.appendChild(btn);
        });
    }

    function playServer(index) {
        const server = currentServers[index];
        if (!server || !server.url) return;
        
        const streamUrl = server.url.replace(/\\u0026/g, '&');
        const userAgent = server.headers?.["User-Agent"] || server.user_agent || "Mozilla/5.0";
        const referer = server.headers?.["Referer"] || server.referer || "https://x.com/";
        
        const video = document.getElementById('player');
        if (hls) hls.destroy();
        
        if (Hls.isSupported()) {
            hls = new Hls({
                xhrSetup: function(xhr) {
                    xhr.setRequestHeader('Referer', referer);
                    xhr.setRequestHeader('User-Agent', userAgent);
                }
            });
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) hls.startLoad(); });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.play();
        }
    }

    function closePlayer() {
        document.getElementById('playerContainer').style.display = 'none';
        if (hls) { hls.destroy(); hls = null; }
        document.getElementById('player').pause();
        document.getElementById('player').src = '';
    }

    document.addEventListener('keydown', (e) => {
        if (document.getElementById('playerContainer').style.display === 'block') {
            if (e.key === 'Escape' || e.keyCode === 8 || e.keyCode === 461) { closePlayer(); e.preventDefault(); }
            return;
        }
        const cards = container.querySelectorAll('.event-card');
        if (!cards.length) return;
        if (e.key === 'ArrowRight') { const next = [...cards].findIndex(c => c === document.activeElement) + 1; if (next < cards.length) cards[next].focus(); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { const prev = [...cards].findIndex(c => c === document.activeElement) - 1; if (prev >= 0) cards[prev].focus(); e.preventDefault(); }
        else if (e.key === 'Enter') { document.activeElement.click(); e.preventDefault(); }
    });

    loadEvents();
</script>

</body>
</html>
