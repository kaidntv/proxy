<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }

        .player-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        video.fill-mode { object-fit: cover; }

        .controls-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.9) 100%);
            opacity: 1;
            visibility: visible;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            z-index: 10;
            pointer-events: none;
        }

        .controls-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .controls-overlay > * { pointer-events: auto; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 16px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .quality-group {
            display: flex;
            gap: 8px;
            direction: ltr;
            flex-wrap: wrap;
        }

        .quality-btn {
            background: rgba(255, 255, 255, 0.12);
            color: #d1d5db;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 5px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }

        .quality-btn.active {
            border-color: #e53935;
            color: #fff;
            background: rgba(229, 57, 53, 0.35);
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-badge {
            background: #e53935;
            color: #fff;
            padding: 3px 10px;
            font-size: 10px;
            font-weight: 700;
            border-radius: 4px;
        }

        .icon-mini {
            background: rgba(255,255,255,0.12);
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            direction: ltr;
        }

        .exo-btn {
            background: rgba(0, 0, 0, 0.35);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(6px);
            transition: transform 0.1s;
        }

        .exo-btn:active { transform: scale(0.85); }
        .exo-btn svg { width: 22px; height: 22px; fill: #fff; }
        .exo-btn.play-pause { width: 60px; height: 60px; }
        .exo-btn.play-pause svg { width: 32px; height: 32px; }

        .bottom-bar {
            padding: 8px 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .bottom-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            direction: ltr;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            opacity: 0.75;
            padding: 4px;
        }

        .icon-btn svg { width: 20px; height: 20px; fill: #fff; }

        .timeline-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 11px;
            direction: ltr;
        }

        .progress-bar {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2196F3;
        }
    </style>
</head>
<body>

<div class="player-wrapper" id="playerWrapper">
    <video id="video" playsinline autoplay></video>

    <div class="controls-overlay" id="overlay">
        
        <div class="top-bar">
            <div class="quality-group" id="controls"></div>
            <div class="top-right">
                <span class="live-badge">LIVE</span>
                <button class="icon-mini" id="fitBtn" onclick="toggleFitFill()">⛶</button>
                <button class="icon-mini" onclick="history.back()">✕</button>
            </div>
        </div>

        <div class="center-controls">
            <button class="exo-btn" onclick="seek(-10)">
                <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
            </button>

            <button class="exo-btn play-pause" onclick="togglePlay()">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>

            <button class="exo-btn" onclick="seek(10)">
                <svg viewBox="0 0 24 24"><path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.16-3.16-1.88-5.12-1.88-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"/></svg>
            </button>
        </div>

        <div class="bottom-bar">
            <div class="bottom-actions">
                <button class="icon-btn" onclick="togglePip()">
                    <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg>
                </button>
                <button class="icon-btn" onclick="toggleFullscreen()">
                    <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </button>
            </div>

            <div class="timeline-row">
                <span id="currentTime">00:00</span>
                <input type="range" class="progress-bar" id="seekBar" value="0" min="0" max="100" step="0.1">
                <span id="duration">00:00</span>
            </div>
        </div>

    </div>
</div>

<script>
    const eventId = new URLSearchParams(window.location.search).get('id');
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const playerWrapper = document.getElementById('playerWrapper');
    const seekBar = document.getElementById('seekBar');
    let hls = null, servers = [], current = 0, hideTimeout = null, isFill = false;

    function enterFullscreen() {
        if (playerWrapper.requestFullscreen) {
            playerWrapper.requestFullscreen().catch(() => {});
        }
    }

    async function load() {
        try {
            const res = await fetch(`/api/events/${eventId}`);
            const json = await res.json();
            servers = json.data || [];
            if (servers.length) {
                renderButtons();
                play(0);
                setTimeout(enterFullscreen, 800);
                startHideTimer();
            }
        } catch(e) { console.error(e); }
    }

    function renderButtons() {
        const el = document.getElementById('controls');
        el.innerHTML = '';
        servers.forEach((s, i) => {
            const btn = document.createElement('button');
            btn.className = 'quality-btn' + (i === current ? ' active' : '');
            btn.innerText = s.name || 'HD';
            btn.onclick = () => { current = i; play(i); renderButtons(); };
            el.appendChild(btn);
        });
    }

    function play(index) {
        const url = `/api/stream/${eventId}.m3u8?server=${index}`;
        if (hls) hls.destroy();

        if (Hls.isSupported()) {
            hls = new Hls({ enableWorker: true, lowLatencyMode: true });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal && d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad(); });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
    }

    function toggleFitFill() {
        isFill = !isFill;
        video.classList.toggle('fill-mode', isFill);
        document.getElementById('fitBtn').style.color = isFill ? '#2196F3' : '#fff';
    }

    function togglePlay() {
        video.paused ? video.play() : video.pause();
    }

    video.addEventListener('play', () => {
        document.getElementById('playIcon').style.display = 'none';
        document.getElementById('pauseIcon').style.display = 'block';
    });

    video.addEventListener('pause', () => {
        document.getElementById('playIcon').style.display = 'block';
        document.getElementById('pauseIcon').style.display = 'none';
    });

    function seek(sec) { video.currentTime += sec; }

    video.addEventListener('timeupdate', () => {
        if (!isNaN(video.duration)) {
            seekBar.value = (video.currentTime / video.duration) * 100;
            document.getElementById('currentTime').innerText = formatTime(video.currentTime);
            document.getElementById('duration').innerText = formatTime(video.duration);
        }
    });

    seekBar.addEventListener('input', () => {
        video.currentTime = (seekBar.value / 100) * video.duration;
    });

    function formatTime(s) {
        const m = Math.floor(s / 60), sec = Math.floor(s % 60);
        return `${m < 10 ? '0' : ''}${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // ====== نظام الإظهار والإخفاء ======
    function showOverlay() {
        overlay.classList.remove('hidden');
        clearTimeout(hideTimeout);
        startHideTimer();
    }

    function hideOverlay() {
        if (!video.paused) {
            overlay.classList.add('hidden');
        }
    }

    function startHideTimer() {
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(hideOverlay, 3000);
    }

    function toggleOverlay() {
        if (overlay.classList.contains('hidden')) {
            showOverlay();
        } else {
            hideOverlay();
        }
    }

    // النقر على الفيديو يظهر/يخفي
    playerWrapper.addEventListener('click', (e) => {
        if (e.target === video || e.target === playerWrapper) {
            toggleOverlay();
        }
    });

    // أي حركة تظهر الأزرار
    playerWrapper.addEventListener('mousemove', showOverlay);
    playerWrapper.addEventListener('touchstart', showOverlay, { passive: true });

    function toggleFullscreen() {
        if (!document.fullscreenElement) playerWrapper.requestFullscreen();
        else document.exitFullscreen();
    }

    function togglePip() {
        if (document.pictureInPictureElement) document.exitPictureInPicture();
        else video.requestPictureInPicture();
    }

    document.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'Enter': togglePlay(); e.preventDefault(); break;
            case 'ArrowRight': seek(10); e.preventDefault(); break;
            case 'ArrowLeft': seek(-10); e.preventDefault(); break;
            case 'ArrowUp': video.volume = Math.min(1, video.volume + 0.1); e.preventDefault(); break;
            case 'ArrowDown': video.volume = Math.max(0, video.volume - 0.1); e.preventDefault(); break;
            case 'Escape': case 'Backspace': history.back(); e.preventDefault(); break;
        }
    });

    load();
</script>

</body>
</html>
