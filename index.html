<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yacine Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f14;
            --bg-secondary: #16161e;
            --bg-card: #1a1a24;
            --bg-hover: #222230;
            --text-primary: #e8e8f0;
            --text-secondary: #8888a0;
            --text-muted: #555568;
            --accent: #5b8def;
            --accent-hover: #4a7de0;
            --live-color: #e04444;
            --border: #2a2a3a;
            --radius: 12px;
            --transition: 0.25s ease;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .top-bar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .top-bar .brand {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent);
        }
        
        .top-bar .date {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px;
        }
        
        .event-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
        }
        
        .event-card:hover, .event-card:focus {
            border-color: var(--accent);
            background: var(--bg-hover);
            transform: translateY(-2px);
            outline: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
        }
        
        .league-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 600;
            color: var(--live-color);
        }
        
        .live-dot {
            width: 6px;
            height: 6px;
            background: var(--live-color);
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .teams-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 14px;
            gap: 8px;
        }
        
        .team {
            text-align: center;
            flex: 1;
            min-width: 0;
        }
        
        .team-logo {
            width: 44px;
            height: 44px;
            object-fit: contain;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
            padding: 6px;
        }
        
        .team-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .match-center {
            text-align: center;
            flex: 0 0 50px;
        }
        
        .match-center .vs {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
        }
        
        .card-footer {
            display: flex;
            justify-content: space-between;
            padding: 8px 14px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        .card-footer .channel {
            color: var(--accent);
            font-weight: 600;
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            width: 90%;
            max-width: 360px;
            text-align: center;
        }
        
        .modal-box h3 {
            font-size: 16px;
            margin-bottom: 20px;
            color: var(--text-primary);
        }
        
        .modal-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
        }
        
        .modal-btn:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
        }
        
        .modal-btn.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        
        .modal-btn.primary:hover {
            background: var(--accent-hover);
        }
        
        .modal-cancel {
            margin-top: 12px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
        }
        
        #loading {
            text-align: center;
            padding: 60px 0;
            color: var(--text-secondary);
        }
        
        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="brand">Yacine Live</div>
    <div class="date" id="dateDisplay"></div>
</div>

<div class="container">
    <div id="loading">
        <div class="spinner"></div>
        Loading...
    </div>
    <div class="events-grid" id="eventsContainer"></div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h3 id="modalTitle"></h3>
        <button class="modal-btn primary" id="btnInternal">Watch Now</button>
        <button class="modal-btn" id="btnExternal">Open External</button>
        <button class="modal-cancel" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
    let selectedEvent = null;

    document.getElementById('dateDisplay').innerText = 
        new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

    async function loadEvents() {
        try {
            const res = await fetch("/api/events");
            const data = await res.json();
            document.getElementById('loading').style.display = 'none';
            renderEvents(data.data || []);
        } catch (e) {
            document.getElementById('loading').innerHTML = '<p>Error: ' + e.message + '</p>';
        }
    }

    function formatTime(ts) {
        return new Date(ts * 1000).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    function isLive(event) {
        const now = Math.floor(Date.now() / 1000);
        return now >= event.start_time && now <= event.end_time;
    }

    function renderEvents(events) {
        const container = document.getElementById('eventsContainer');
        container.innerHTML = '';
        
        events.forEach(event => {
            const card = document.createElement('div');
            card.className = 'event-card';
            card.tabIndex = 0;
            
            const live = isLive(event);
            
            card.innerHTML = `
                <div class="card-header">
                    <span class="league-name">${event.champions || ''}</span>
                    ${live ? '<span class="live-indicator"><span class="live-dot"></span>LIVE</span>' : ''}
                </div>
                <div class="teams-section">
                    <div class="team">
                        <img class="team-logo" src="${event.team_1?.logo || ''}" onerror="this.style.visibility='hidden'">
                        <div class="team-name">${event.team_1?.name || ''}</div>
                    </div>
                    <div class="match-center">
                        <span class="vs">VS</span>
                    </div>
                    <div class="team">
                        <img class="team-logo" src="${event.team_2?.logo || ''}" onerror="this.style.visibility='hidden'">
                        <div class="team-name">${event.team_2?.name || ''}</div>
                    </div>
                </div>
                <div class="card-footer">
                    <span class="channel">${event.channel || ''}</span>
                    <span>${formatTime(event.start_time)}</span>
                </div>
            `;
            
            card.onclick = () => openModal(event);
            card.onkeydown = (e) => { if (e.key === 'Enter') openModal(event); };
            container.appendChild(card);
        });
    }

    function openModal(event) {
        selectedEvent = event;
        document.getElementById('modalTitle').innerText = 
            `${event.team_1?.name || ''} vs ${event.team_2?.name || ''}`;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        selectedEvent = null;
    }

    document.getElementById('btnInternal').onclick = function() {
        if (selectedEvent) {
            window.location.href = `/player.html?id=${selectedEvent.id}`;
        }
        closeModal();
    };

    document.getElementById('btnExternal').onclick = async function() {
        if (!selectedEvent) return;
        try {
            const res = await fetch(`/api/events/${selectedEvent.id}`);
            const json = await res.json();
            const servers = json.data?.servers || json.servers || json.data || [];
            if (servers.length > 0) {
                window.location.href = servers[0].url.replace(/\\u0026/g, '&');
            }
        } catch (e) {
            alert('Error: ' + e.message);
        }
        closeModal();
    };

    document.addEventListener('keydown', (e) => {
        if (document.getElementById('modal').style.display === 'flex') {
            if (e.key === 'Escape') { closeModal(); e.preventDefault(); }
            return;
        }
        
        const cards = document.querySelectorAll('.event-card');
        if (!cards.length) return;
        const idx = [...cards].findIndex(c => c === document.activeElement);
        
        if (e.key === 'ArrowRight') { const n = idx + 1; if (n < cards.length) cards[n].focus(); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { const p = idx - 1; if (p >= 0) cards[p].focus(); e.preventDefault(); }
        else if (e.key === 'ArrowDown') { const n = idx + 3; if (n < cards.length) cards[n].focus(); e.preventDefault(); }
        else if (e.key === 'ArrowUp') { const p = idx - 3; if (p >= 0) cards[p].focus(); e.preventDefault(); }
        else if (e.key === 'Enter') { document.activeElement.click(); e.preventDefault(); }
    });

    loadEvents();
</script>

</body>
</html>
