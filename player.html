<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; height: 100vh; overflow: hidden; font-family: 'Cairo', sans-serif; }
        video { width: 100%; height: 100%; }
        .controls { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 100; }
        .quality-btn { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .quality-btn.active { background: #5b8def; border-color: #5b8def; }
        .back-btn { position: fixed; top: 15px; right: 15px; z-index: 100; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>

<button class="back-btn" onclick="window.location.href='/'">Back</button>
<video id="video" controls autoplay playsinline></video>
<div class="controls" id="controls"></div>

<script>
    const eventId = new URLSearchParams(window.location.search).get('id');
    let hls = null;
    let servers = [];
    let currentIndex = 0;

    async function load() {
        try {
            const res = await fetch(`/api/events/${eventId}`);
            const json = await res.json();
            const rawServers = json.data || [];
            
            if (!rawServers.length) {
                document.body.innerHTML = '<div style="color:#fff;text-align:center;padding:50px;">No streams available</div>';
                return;
            }
            
            // استخدام /stream/ مع server index
            servers = rawServers.map((s, i) => ({
                name: s.name || 'Stream ' + (i + 1),
                url: `/stream/${eventId}.m3u8?server=${i}`
            }));
            
            renderButtons();
            play(0);
        } catch (e) {
            document.body.innerHTML = '<div style="color:#fff;text-align:center;padding:50px;">Error: ' + e.message + '</div>';
        }
    }

    function renderButtons() {
        const el = document.getElementById('controls');
        el.innerHTML = '';
        servers.forEach((s, i) => {
            const btn = document.createElement('button');
            btn.className = 'quality-btn' + (i === currentIndex ? ' active' : '');
            btn.innerText = s.name;
            btn.onclick = () => { currentIndex = i; play(i); renderButtons(); };
            el.appendChild(btn);
        });
    }

    function play(index) {
        const server = servers[index];
        if (!server) return;
        
        const video = document.getElementById('video');
        if (hls) hls.destroy();
        
        if (Hls.isSupported()) {
            hls = new Hls({ enableWorker: true, lowLatencyMode: true });
            hls.loadSource(server.url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
                    else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = server.url;
            video.play();
        }
    }

    load();
</script>

</body>
</html>
