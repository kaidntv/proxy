<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }

        .player-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        video.fill-mode { object-fit: cover; }

        .top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            gap: 10px;
            flex-wrap: wrap;
            z-index: 20;
            transition: opacity 0.25s ease, transform 0.25s ease;
            opacity: 1;
            transform: translateY(0);
            pointer-events: none;
        }

        .top-bar.hidden-top { opacity: 0; transform: translateY(-15px); }
        .top-bar > * { pointer-events: auto; }

        .quality-group { display: flex; gap: 8px; direction: ltr; flex-wrap: wrap; }
        .quality-btn {
            background: rgba(0,0,0,0.5); color: #d1d5db;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 5px 14px; border-radius: 16px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            transition: all 0.2s;
        }
        .quality-btn.active { border-color: #e53935; color: #fff; background: rgba(229,57,53,0.4); }

        .top-right { display: flex; align-items: center; gap: 8px; }
        .live-badge { background: #e53935; color: #fff; padding: 3px 10px; font-size: 10px; font-weight: 700; border-radius: 4px; }
        .icon-mini {
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; width: 32px; height: 32px; border-radius: 50%;
            font-size: 13px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .center-controls {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex; align-items: center; justify-content: center;
            gap: 28px; direction: ltr; z-index: 20;
            transition: opacity 0.25s ease;
            opacity: 1;
            pointer-events: none;
        }
        .center-controls.hidden-center { opacity: 0; }
        .center-controls > * { pointer-events: auto; }

        .exo-btn {
            background: rgba(0,0,0,0.4); border: none; color: #fff;
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(6px);
            transition: transform 0.1s;
        }
        .exo-btn:active { transform: scale(0.85); }
        .exo-btn svg { width: 22px; height: 22px; fill: #fff; }
        .exo-btn.play-pause { width: 58px; height: 58px; }
        .exo-btn.play-pause svg { width: 30px; height: 30px; }

        .bottom-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 8px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            display: flex; flex-direction: column; gap: 6px;
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            z-index: 15;
        }
        .bottom-actions { display: flex; justify-content: center; gap: 14px; direction: ltr; }
        .icon-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn svg { width: 18px; height: 18px; fill: #fff; }

        .timeline-row { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 11px; direction: ltr; }
        .progress-bar {
            flex: 1; -webkit-appearance: none; appearance: none;
            height: 3px; background: rgba(255,255,255,0.3);
            border-radius: 2px; outline: none; cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px;
            border-radius: 50%; background: #2196F3;
        }
    </style>
</head>
<body>

<div class="player-wrapper" id="playerWrapper">
    <video id="video" playsinline autoplay></video>

    <div class="top-bar" id="topBar">
        <div class="quality-group" id="controls"></div>
        <div class="top-right">
            <span class="live-badge">LIVE</span>
            <button class="icon-mini" id="fitBtn" onclick="toggleFitFill()">FIT</button>
            <button class="icon-mini" onclick="history.back()">✕</button>
        </div>
    </div>

    <div class="center-controls" id="centerControls">
        <button class="exo-btn" onclick="seek(-10)">
            <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
        </button>
        <button class="exo-btn play-pause" onclick="togglePlay()">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="exo-btn" onclick="seek(10)">
            <svg viewBox="0 0 24 24"><path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.16-3.16-1.88-5.12-1.88-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"/></svg>
        </button>
    </div>

    <div class="bottom-bar">
        <div class="bottom-actions">
            <button class="icon-btn" onclick="togglePip()">
                <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg>
            </button>
            <button class="icon-btn" onclick="toggleFullscreen()">
                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
        </div>
        <div class="timeline-row">
            <span id="currentTime">00:00</span>
            <input type="range" class="progress-bar" id="seekBar" value="0" min="0" max="100" step="0.1">
            <span id="duration">00:00</span>
        </div>
    </div>
</div>

<script>
    const eventId = new URLSearchParams(window.location.search).get('id');
    const video = document.getElementById('video');
    const playerWrapper = document.getElementById('playerWrapper');
    const topBar = document.getElementById('topBar');
    const centerControls = document.getElementById('centerControls');
    const seekBar = document.getElementById('seekBar');
    let hls = null, servers = [], current = 0, hideTimeout = null, isFill = false;

    // دخول تلقائي للوضع الأفقي ملئ الشاشة
    async function enterLandscapeFullscreen() {
        try {
            if (screen.orientation && screen.orientation.lock) {
                await screen.orientation.lock('landscape').catch(() => {});
            }
        } catch(e) {}
        try {
            if (playerWrapper.requestFullscreen) {
                await playerWrapper.requestFullscreen().catch(() => {});
            }
        } catch(e) {}
    }

    async function load() {
        try {
            const res = await fetch(`/api/events/${eventId}`);
            const json = await res.json();
            servers = json.data || [];
            if (servers.length) {
                renderButtons();
                play(0);
                setTimeout(enterLandscapeFullscreen, 600);
                startHideTimer();
            }
        } catch(e) { console.error(e); }
    }

    function renderButtons() {
        const el = document.getElementById('controls');
        el.innerHTML = '';
        servers.forEach((s, i) => {
            const btn = document.createElement('button');
            btn.className = 'quality-btn' + (i === current ? ' active' : '');
            btn.innerText = s.name || 'HD';
            btn.onclick = () => { current = i; play(i); renderButtons(); };
            el.appendChild(btn);
        });
    }

    function play(index) {
        const url = `/api/stream/${eventId}.m3u8?server=${index}`;
        if (hls) hls.destroy();
        if (Hls.isSupported()) {
            hls = new Hls({ enableWorker: true, lowLatencyMode: true });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal && d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad(); });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url; video.play();
        }
    }

    function toggleFitFill() {
        isFill = !isFill;
        video.classList.toggle('fill-mode', isFill);
        document.getElementById('fitBtn').innerText = isFill ? 'FILL' : 'FIT';
        document.getElementById('fitBtn').style.color = isFill ? '#2196F3' : '#fff';
    }

    function togglePlay() { video.paused ? video.play() : video.pause(); }

    video.addEventListener('play', () => {
        document.getElementById('playIcon').style.display = 'none';
        document.getElementById('pauseIcon').style.display = 'block';
    });
    video.addEventListener('pause', () => {
        document.getElementById('playIcon').style.display = 'block';
        document.getElementById('pauseIcon').style.display = 'none';
    });

    function seek(sec) { video.currentTime += sec; }

    video.addEventListener('timeupdate', () => {
        if (!isNaN(video.duration)) {
            seekBar.value = (video.currentTime / video.duration) * 100;
            document.getElementById('currentTime').innerText = formatTime(video.currentTime);
            document.getElementById('duration').innerText = formatTime(video.duration);
        }
    });

    seekBar.addEventListener('input', () => {
        video.currentTime = (seekBar.value / 100) * video.duration;
    });

    function formatTime(s) {
        const m = Math.floor(s / 60), sec = Math.floor(s % 60);
        return `${m<10?'0':''}${m}:${sec<10?'0':''}${sec}`;
    }

    // ====== تفاعل سلس ======
    function showControls() {
        topBar.classList.remove('hidden-top');
        centerControls.classList.remove('hidden-center');
        clearTimeout(hideTimeout);
        startHideTimer();
    }

    function hideControls() {
        if (!video.paused) {
            topBar.classList.add('hidden-top');
            centerControls.classList.add('hidden-center');
        }
    }

    function toggleControls() {
        if (topBar.classList.contains('hidden-top')) showControls();
        else hideControls();
    }

    function startHideTimer() {
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(hideControls, 4000);
    }

    // نقرة واحدة = تبديل، لمس = إظهار
    let lastTap = 0;
    playerWrapper.addEventListener('click', (e) => {
        const now = Date.now();
        if (now - lastTap < 300) return;
        lastTap = now;
        if (e.target === video || e.target === playerWrapper) toggleControls();
    });

    playerWrapper.addEventListener('touchstart', (e) => {
        if (e.target === video || e.target === playerWrapper) showControls();
    }, { passive: true });

    function toggleFullscreen() {
        if (!document.fullscreenElement) playerWrapper.requestFullscreen();
        else document.exitFullscreen();
    }

    function togglePip() {
        if (document.pictureInPictureElement) document.exitPictureInPicture();
        else video.requestPictureInPicture();
    }

    document.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'Enter': togglePlay(); e.preventDefault(); break;
            case 'ArrowRight': seek(10); e.preventDefault(); break;
            case 'ArrowLeft': seek(-10); e.preventDefault(); break;
            case 'ArrowUp': video.volume = Math.min(1, video.volume + 0.1); e.preventDefault(); break;
            case 'ArrowDown': video.volume = Math.max(0, video.volume - 0.1); e.preventDefault(); break;
            case 'Escape': case 'Backspace': history.back(); e.preventDefault(); break;
        }
    });

    load();
</script>

</body>
</html>
